<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Liquid Glass UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #canvas-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .glass-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .glass-card {
      width: 280px;
      height: 400px;
      border-radius: 28px;
      position: relative;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 8px 20px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
      cursor: pointer;
      transform-style: preserve-3d;
    }
    .glass-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 
        0 30px 70px rgba(0, 0, 0, 0.5),
        0 12px 25px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
    }
    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, transparent 40%);
      pointer-events: none;
      z-index: 2;
    }
    .glass-card .reflection {
      position: absolute;
      width: 200px;
      height: 100px;
      background: radial-gradient(ellipse, rgba(255,255,255,0.4) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(12px);
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: all 0.3s ease;
    }
    .card-content {
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 3;
      color: white;
    }
    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .card-desc {
      font-size: 0.85rem;
      opacity: 0.75;
      line-height: 1.5;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      opacity: 0.6;
    }
    .card-badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .status-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 0.85rem;
      z-index: 10;
    }
    .time { font-weight: 500; }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icon { width: 18px; height: 18px; fill: white; }

    .dock {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .dock-icon:hover { transform: scale(1.15) translateY(-5px); }

    .widget {
      position: fixed;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      color: white;
      padding: 16px;
      z-index: 5;
    }
    .widget-weather {
      top: 60px;
      right: 30px;
      width: 160px;
    }
    .widget-battery {
      top: 60px;
      left: 30px;
      width: 160px;
    }

    .controls-panel {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .control-pill {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 16px;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .control-pill:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }
    .control-pill.active {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.5);
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-2deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .card-1 { animation: float1 6s ease-in-out infinite; animation-delay: 0s; }
    .card-2 { animation: float2 7s ease-in-out infinite; animation-delay: 0.5s; }
    .card-3 { animation: float1 8s ease-in-out infinite; animation-delay: 1s; }
  </style>
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  
  <div class="status-bar">
    <span class="time" id="clock">9:41</span>
    <div class="status-icons">
      <svg class="status-icon" viewBox="0 0 24 24">
        <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.86 9.14 5 13z"/>
      </svg>
      <svg class="status-icon" viewBox="0 0 24 24">
        <path d="M1 11h2v10h8v-6h4v-4h8v4h-2v6h2V11H1z"/>
      </svg>
      <svg class="status-icon" viewBox="0 0 24 24">
        <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
      </svg>
    </div>
  </div>

  <div class="widget widget-weather">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-size: 0.75rem; opacity: 0.7;">Weather</span>
      <span style="font-size: 1.5rem;">☀️</span>
    </div>
    <div style="font-size: 1.8rem; font-weight: 600; margin-bottom: 4px;">28°</div>
    <div style="font-size: 0.75rem; opacity: 0.6;">Sunny • H:32° L:24°</div>
  </div>

  <div class="widget widget-battery">
    <div style="font-size: 0.75rem; opacity: 0.7; margin-bottom: 10px;">Battery</div>
    <div style="font-size: 2rem; font-weight: 600; margin-bottom: 6px;">87%</div>
    <div style="height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
      <div style="width: 87%; height: 100%; background: linear-gradient(90deg, #34c759, #30d158); border-radius: 2px;"></div>
    </div>
  </div>

  <div class="glass-overlay">
    <div class="glass-card card-1" id="card1">
      <div class="reflection"></div>
      <div class="card-content">
        <div>
          <div class="card-icon">🎵</div>
          <div class="card-title">Now Playing</div>
          <div class="card-desc">Blinding Lights • The Weeknd</div>
        </div>
        <div class="card-footer">
          <span>2:34 / 3:20</span>
          <span class="card-badge">♫ Live</span>
        </div>
      </div>
    </div>

    <div class="glass-card card-2" id="card2">
      <div class="reflection"></div>
      <div class="card-content">
        <div>
          <div class="card-icon">💳</div>
          <div class="card-title">Apple Card</div>
          <div class="card-desc">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="font-size: 0.75rem; opacity: 0.6;">Balance</span>
              <span>$1,245.50</span>
            </div>
            <div style="height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;">
              <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #007aff, #5856d6); border-radius: 2px;"></div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <span>Due: Jan 15</span>
          <span class="card-badge">💎 Premium</span>
        </div>
      </div>
    </div>

    <div class="glass-card card-3" id="card3">
      <div class="reflection"></div>
      <div class="card-content">
        <div>
          <div class="card-icon">📊</div>
          <div class="card-title">Activity</div>
          <div class="card-desc">
            <div style="display: flex; gap: 12px; margin: 12px 0;">
              <div style="text-align: center;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff3b30, #ff9500); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">680</div>
                <span style="font-size: 0.7rem; opacity: 0.6;">CAL</span>
              </div>
              <div style="text-align: center;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #34c759, #30d158); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">42</div>
                <span style="font-size: 0.7rem; opacity: 0.6;">EXR</span>
              </div>
              <div style="text-align: center;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #007aff, #5ac8fa); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">10</div>
                <span style="font-size: 0.7rem; opacity: 0.6;">STD</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <span>Today</span>
          <span class="card-badge">🔥 7 Day</span>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="control-pill active" onclick="setTheme('default')">Default</div>
    <div class="control-pill" onclick="setTheme('aurora')">Aurora</div>
    <div class="control-pill" onclick="setTheme('sunset')">Sunset</div>
    <div class="control-pill" onclick="toggleBlur()">Blur: On</div>
  </div>

  <div class="dock">
    <div class="dock-icon">🏠</div>
    <div class="dock-icon">🔍</div>
    <div class="dock-icon">💬</div>
    <div class="dock-icon">📷</div>
    <div class="dock-icon">⚙️</div>
  </div>

  <canvas id="liquid-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>

  <script>
    // Update clock
    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Liquid background effect
    const canvas = document.getElementById('liquid-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let theme = 'default';
    const mouse = { x: 0, y: 0 };
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Mouse tracking
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // Liquid blobs
    const blobs = [
      { x: 0, y: 0, vx: 0, vy: 0, radius: 250, color: [100, 50, 200] },
      { x: 0, y: 0, vx: 0, vy: 0, radius: 300, color: [200, 50, 150] },
      { x: 0, y: 0, vx: 0, vy: 0, radius: 200, color: [50, 100, 255] },
      { x: 0, y: 0, vx: 0, vy: 0, radius: 280, color: [255, 80, 100] },
      { x: 0, y: 0, vx: 0, vy: 0, radius: 220, color: [50, 200, 180] }
    ];

    function initBlobs() {
      blobs.forEach(blob => {
        blob.x = Math.random() * width;
        blob.y = Math.random() * height;
        blob.vx = (Math.random() - 0.5) * 0.5;
        blob.vy = (Math.random() - 0.5) * 0.5;
      });
    }
    initBlobs();

    const themes = {
      default: [
        [100, 50, 200],
        [200, 50, 150],
        [50, 100, 255],
        [255, 80, 100],
        [50, 200, 180]
      ],
      aurora: [
        [0, 200, 100],
        [100, 0, 255],
        [50, 255, 200],
        [150, 0, 200],
        [0, 150, 255]
      ],
      sunset: [
        [255, 100, 50],
        [255, 50, 100],
        [200, 50, 150],
        [255, 150, 50],
        [255, 200, 80]
      ]
    };

    function setTheme(themeName) {
      theme = themeName;
      blobs.forEach((blob, i) => {
        blob.color = themes[themeName][i];
      });
      document.querySelectorAll('.control-pill').forEach((pill, i) => {
        pill.classList.toggle('active', i < 3 && themeName === ['default', 'aurora', 'sunset'][i]);
      });
    }

    let blurEnabled = true;
    function toggleBlur() {
      blurEnabled = !blurEnabled;
      document.querySelectorAll('.control-pill')[3].textContent = `Blur: ${blurEnabled ? 'On' : 'Off'}`;
      document.querySelectorAll('.glass-card').forEach(card => {
        card.style.backdropFilter = blurEnabled ? 'blur(24px) saturate(180%)' : 'none';
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      // Update blob positions
      blobs.forEach((blob, i) => {
        blob.x += blob.vx + Math.sin(time + i) * 0.5;
        blob.y += blob.vy + Math.cos(time * 0.8 + i) * 0.4;

        // Bounce off edges
        if (blob.x < -blob.radius) blob.x = width + blob.radius;
        if (blob.x > width + blob.radius) blob.x = -blob.radius;
        if (blob.y < -blob.radius) blob.y = height + blob.radius;
        if (blob.y > height + blob.radius) blob.y = -blob.radius;

        // Attract to mouse
        const dx = mouse.x - blob.x;
        const dy = mouse.y - blob.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0) {
          blob.vx += (dx / dist) * 0.01;
          blob.vy += (dy / dist) * 0.01;
        }

        // Damping
        blob.vx *= 0.99;
        blob.vy *= 0.99;
      });

      // Clear canvas
      ctx.clearRect(0, 0, width, height);

      // Draw gradient background
      const bgGrad = ctx.createRadialGradient(width * 0.3, height * 0.2, 0, width * 0.3, height * 0.2, Math.max(width, height));
      bgGrad.addColorStop(0, '#0a0520');
      bgGrad.addColorStop(0.5, '#050210');
      bgGrad.addColorStop(1, '#000000');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Draw liquid blobs
      ctx.globalCompositeOperation = 'lighter';
      blobs.forEach((blob, i) => {
        const gradient = ctx.createRadialGradient(
          blob.x, blob.y, 0,
          blob.x, blob.y, blob.radius
        );
        const [r, g, b] = blob.color;
        gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.4)`);
        gradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.2)`);
        gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Reset composite
      ctx.globalCompositeOperation = 'source-over';

      // Update glass card reflections
      document.querySelectorAll('.glass-card').forEach(card => {
        const reflection = card.querySelector('.reflection');
        const rect = card.getBoundingClientRect();
        const cardX = rect.left + rect.width / 2;
        const cardY = rect.top + rect.height / 2;
        
        const dx = mouse.x - cardX;
        const dy = mouse.y - cardY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        const targetX = mouse.x - rect.left;
        const targetY = mouse.y - rect.top;
        
        reflection.style.left = `${targetX}px`;
        reflection.style.top = `${targetY}px`;
        reflection.style.opacity = Math.max(0, 1 - dist / 600);
      });
    }
    animate();
  </script>
</body>
</html>
