<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract AI marketing field</title>
  <desc id="desc">A warm cinematic field with a perspective grid and floating glass product tiles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset=".28" stop-color="#ffe1bd"/>
      <stop offset=".66" stop-color="#dfaaa0"/>
      <stop offset="1" stop-color="#c58f8d"/>
    </linearGradient>
    <radialGradient id="sun" cx=".45" cy=".5" r=".42">
      <stop offset="0" stop-color="#fff6bd" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#ffd9a6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd9a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx=".5" cy=".82" r=".35">
      <stop offset="0" stop-color="#8847e8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8847e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffafd"/>
      <stop offset=".72" stop-color="#e8d7ef"/>
      <stop offset="1" stop-color="#c7a2df"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="24" flood-color="#5b347a" flood-opacity=".24"/>
    </filter>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0v84" fill="none" stroke="#7d44d8" stroke-opacity=".36" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="2100" height="900" fill="url(#sky)"/>
  <rect width="2100" height="900" fill="url(#sun)"/>
  <rect width="2100" height="900" fill="url(#violet)"/>
  <g transform="translate(0 615)">
    <path d="M0 235 420 0h1260l420 235Z" fill="url(#grid)" opacity=".95"/>
    <path d="M0 235 420 0h1260l420 235Z" fill="url(#violet)" opacity=".55"/>
    <g opacity=".33" fill="#5c4b62">
      <path d="M0 206h500l-90 28H0z"/>
