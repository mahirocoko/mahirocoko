<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Resource thumbnail system</title>
  <desc id="desc">A calm reusable thumbnail system with thin line art and soft editorial color fields.</desc>
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effded"/>
      <stop offset="1" stop-color="#dff8e7"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efff"/>
      <stop offset="1" stop-color="#ead9ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0faff"/>
      <stop offset="1" stop-color="#dceef8"/>
    </linearGradient>
  </defs>
  <rect width="720" height="450" fill="url(#mint)"/>
  <circle cx="360" cy="225" r="166" fill="none" stroke="#27aa68" stroke-opacity=".22" stroke-width="3"/>
  <circle cx="360" cy="225" r="104" fill="none" stroke="#27aa68" stroke-opacity=".2" stroke-width="3"/>
  <g transform="translate(250 128)">
    <rect width="220" height="165" rx="28" fill="#fff" fill-opacity=".36" stroke="#27aa68" stroke-width="4"/>
    <path d="M55 64h110M55 95h76M55 126h110M154 87h34v34h-34z" fill="none" stroke="#27aa68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M0 0h190v450H0z" fill="url(#blue)" opacity=".55"/>
  <path d="M530 0h190v450H530z" fill="url(#lilac)" opacity=".55"/>
</svg>
